[package]
name = "corolla"
version = "0.1.1"
edition = "2024"
description = "An interactive radial disk explorer for Omarchy"

[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "=0.32.3"
libc = "0.2"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = "1"
tempfile = "3"
rfd = "0.15"

[profile.release]
strip = true
